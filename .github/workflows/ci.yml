name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Unit, Build and Production Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Cloud local contract smoke
        run: npm run qa:cloud
      # TM-P2-008 §62：Worker 本地契约冒烟（wrangler dev --local，无需浏览器）
      - name: Worker local contract smoke
        run: npm run qa:worker
      # TM-P2-003-R3 H：生产浏览器 Smoke 门禁——真实构建 + preview + Puppeteer 验证主菜单
      # （preview 后台启动；循环 fetch 等待就绪，不用 wait-on / sleep 硬等；
      #  Chrome 可执行路径取自 runner 真实命令，不写死 /usr/bin/google-chrome）
      - name: Production browser smoke
        run: |
          npm run preview -- --host 127.0.0.1 --port 5198 &
          PREVIEW_PID=$!
          READY=0
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:5198/; then
              echo "preview ready (${i}s)"
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "preview server did not become ready in time"
            kill $PREVIEW_PID 2>/dev/null || true
            exit 1
          fi
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)" \
            BASE_URL=http://127.0.0.1:5198/ node qa/prod-smoke.mjs
          EXIT_CODE=$?
          kill $PREVIEW_PID 2>/dev/null || true
          exit $EXIT_CODE

  release-regression:
    name: Release Regression
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run release regression
        run: |
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "Chrome executable was not found on the runner"
            exit 1
          fi
          echo "Using Chrome at $CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" npm run qa:rc

  qa-p2-008:
    name: P2-008 E2E Regression
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # TM-P2-008 §47-57：AS1-12 / N1-15 / layout / MOB1-6 / full-journey / balance 全量回归。
      # 各 E2E 脚本自备本地 dev server（--strictPort）；balance 无需浏览器。
      - name: Run P2-008 E2E suite
        run: |
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "Chrome executable was not found on the runner"
            exit 1
          fi
          echo "Using Chrome at $CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" npm run qa:p2-008

  qa-p2-009:
    name: P2-009 E2E Regression
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # TM-P2-009：sidebar（§4-8 封板修复）+ north-story（§9-19 断旗余声全流程）+ full-journey
      # （§31 北线三段链 + 窄前置）+ layout（§14-15 断点）+ balance（§13 驿站狼群）全量回归。
      # 各 E2E 脚本自备本地 dev server（--strictPort 5241-5244）；balance 无需浏览器。
      - name: Run P2-009 E2E suite
        run: |
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "Chrome executable was not found on the runner"
            exit 1
          fi
          echo "Using Chrome at $CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" npm run qa:p2-009
